# Produção no VPS (Hetzner CX22 ~2 vCPU / 4GB) — Laravel + Postgres + Redis.
# Caddy do host: reverse_proxy 127.0.0.1:8080
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: conectaking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conectaking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-conectaking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conectaking} -d ${POSTGRES_DB:-conectaking}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 768m
    networks:
      - cknet

  redis:
    image: redis:7-alpine
    container_name: conectaking-redis
    restart: unless-stopped
    # Teto de RAM + LRU; AOF leve (sem RDB agressivo)
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--appendfsync", "everysec",
        "--save", "",
        "--maxmemory", "192mb",
        "--maxmemory-policy", "allkeys-lru",
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 256m
    networks:
      - cknet

  laravel:
    build:
      context: .
      dockerfile: laravel/Dockerfile
    container_name: conectaking-laravel
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      APP_NAME: ConectaKing
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://www.conectaking.com.br
      APP_KEY: ${LARAVEL_APP_KEY}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-conectaking}
      DB_USERNAME: ${POSTGRES_USER:-conectaking}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RECIBO_OCR_AI: ${RECIBO_OCR_AI:-auto}
      RECIBO_OCR_AI_MODEL: ${RECIBO_OCR_AI_MODEL:-gpt-4o-mini}
      BIBLE_CUNHA_URL: ${BIBLE_CUNHA_URL:-}
      BIBLE_AI_URL: ${BIBLE_AI_URL:-}
      KS_UPLOADS_PATH: /shared/uploads
      LEGACY_PUBLIC_PATH: /legacy/public
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@conectaking.com.br}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_TO_NOTIFY: ${EMAIL_TO_NOTIFY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      SERVER_NAME: ":8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - api_uploads:/shared/uploads
      - ./public:/legacy/public:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 1536m
    cpus: 1.50
    networks:
      - cknet

  queue:
    build:
      context: .
      dockerfile: laravel/Dockerfile
    container_name: conectaking-queue
    restart: unless-stopped
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "redis",
        "--sleep=2",
        "--tries=3",
        "--max-time=1800",
        "--max-jobs=40",
        "--memory=192",
      ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      laravel:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      APP_NAME: ConectaKing
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://www.conectaking.com.br
      APP_KEY: ${LARAVEL_APP_KEY}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-conectaking}
      DB_USERNAME: ${POSTGRES_USER:-conectaking}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      KS_UPLOADS_PATH: /shared/uploads
      LEGACY_PUBLIC_PATH: /legacy/public
    volumes:
      - api_uploads:/shared/uploads
      - ./public:/legacy/public:ro
    mem_limit: 512m
    cpus: 0.75
    networks:
      - cknet

volumes:
  pgdata:
  api_uploads:
  redisdata:

networks:
  cknet:
    driver: bridge
