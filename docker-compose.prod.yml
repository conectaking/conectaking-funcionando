# Produção no VPS (Hetzner) — só Laravel (FrankenPHP) + Postgres.
# Caddy do host: reverse_proxy 127.0.0.1:8080
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: conectaking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conectaking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-conectaking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conectaking} -d ${POSTGRES_DB:-conectaking}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - cknet

  # Edge app: FrankenPHP classic (HTTP :8080). TLS fica no Caddy do host.
  laravel:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    container_name: conectaking-laravel
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      APP_NAME: ConectaKing
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://www.conectaking.com.br
      APP_KEY: ${LARAVEL_APP_KEY}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-conectaking}
      DB_USERNAME: ${POSTGRES_USER:-conectaking}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RECIBO_OCR_AI: ${RECIBO_OCR_AI:-auto}
      RECIBO_OCR_AI_MODEL: ${RECIBO_OCR_AI_MODEL:-gpt-4o-mini}
      BIBLE_CUNHA_URL: ${BIBLE_CUNHA_URL:-}
      BIBLE_AI_URL: ${BIBLE_AI_URL:-}
      KS_UPLOADS_PATH: /shared/uploads
      LEGACY_PUBLIC_PATH: /legacy/public
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@conectaking.com.br}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_TO_NOTIFY: ${EMAIL_TO_NOTIFY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      SERVER_NAME: ":8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - api_uploads:/shared/uploads
      - ./public:/legacy/public:ro
    # FrankenPHP image healthchecka :2019/metrics (admin off) — usar /health na app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - cknet

volumes:
  pgdata:
  api_uploads:

networks:
  cknet:
    driver: bridge
