# Produção no VPS (Hetzner) — API só em localhost; Caddy faz 80/443
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: conectaking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conectaking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-conectaking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conectaking} -d ${POSTGRES_DB:-conectaking}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - cknet

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conectaking-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      laravel:
        condition: service_started
    env_file:
      - .env.prod
    environment:
      PORT: "5000"
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-conectaking}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-conectaking}
      DATABASE_SSL: "false"
      LARAVEL_CARD_ENABLED: "${LARAVEL_CARD_ENABLED:-true}"
      LARAVEL_CARD_PUBLIC: "${LARAVEL_CARD_PUBLIC:-false}"
      LARAVEL_CARD_SLUGS: "${LARAVEL_CARD_SLUGS:-}"
      LARAVEL_CARD_APIS: "${LARAVEL_CARD_APIS:-true}"
      LARAVEL_PROFILE_API: "${LARAVEL_PROFILE_API:-false}"
      LARAVEL_UPLOAD_API: "${LARAVEL_UPLOAD_API:-false}"
      LARAVEL_SATELLITES: "${LARAVEL_SATELLITES:-false}"
      LARAVEL_ADMIN_BIBLE: "${LARAVEL_ADMIN_BIBLE:-}"
      LARAVEL_KS: "${LARAVEL_KS:-false}"
      LARAVEL_KS_SLUGS: "${LARAVEL_KS_SLUGS:-}"
      LARAVEL_HOST: laravel
      LARAVEL_PORT: "8080"
      LARAVEL_DASHBOARD: "${LARAVEL_DASHBOARD:-true}"
      LEGACY_PUBLIC_PATH: /legacy/public
      LEGACY_PUBLIC_HTML_PATH: /legacy/public_html
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - api_uploads:/app/uploads
    networks:
      - cknet

  # Cartão virtual (migração gradual) — rotas /l/card/{slug} e /l/api/card/{slug}
  laravel:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    container_name: conectaking-laravel
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      APP_NAME: ConectaKing
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://www.conectaking.com.br
      APP_KEY: ${LARAVEL_APP_KEY}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-conectaking}
      DB_USERNAME: ${POSTGRES_USER:-conectaking}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      NODE_INTERNAL_URL: http://api:5000
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RECIBO_OCR_AI: ${RECIBO_OCR_AI:-auto}
      RECIBO_OCR_AI_MODEL: ${RECIBO_OCR_AI_MODEL:-gpt-4o-mini}
      BIBLE_CUNHA_URL: ${BIBLE_CUNHA_URL:-}
      BIBLE_AI_URL: ${BIBLE_AI_URL:-}
      KS_UPLOADS_PATH: /shared/uploads
      LEGACY_PUBLIC_PATH: /legacy/public
      LEGACY_PUBLIC_HTML_PATH: /legacy/public_html
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@conectaking.com.br}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # APIs residuais migradas do Node (inquiry, payment, push)
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_TO_NOTIFY: ${EMAIL_TO_NOTIFY:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_INDIVIDUAL_PLAN_ID: ${MERCADOPAGO_INDIVIDUAL_PLAN_ID:-}
      MERCADOPAGO_BACK_URL_SUCCESS: ${MERCADOPAGO_BACK_URL_SUCCESS:-}
      MERCADOPAGO_BACK_URL_FAILURE: ${MERCADOPAGO_BACK_URL_FAILURE:-}
      MERCADOPAGO_BACK_URL_PENDING: ${MERCADOPAGO_BACK_URL_PENDING:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      # Checkout KingForms (PagBank) — mesmas variáveis do módulo Node
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      CHECKOUT_ENCRYPTION_KEY: ${CHECKOUT_ENCRYPTION_KEY:-}
      PAGBANK_API_BASE_URL: ${PAGBANK_API_BASE_URL:-}
      PAGBANK_API_URL: ${PAGBANK_API_URL:-}
      PAGBANK_LEGACY_API_URL: ${PAGBANK_LEGACY_API_URL:-}
      PAGBANK_PLATFORM_ACCESS_TOKEN: ${PAGBANK_PLATFORM_ACCESS_TOKEN:-}
      PAGBANK_PLATFORM_ACCOUNT_ID: ${PAGBANK_PLATFORM_ACCOUNT_ID:-}
      PAGBANK_TOKEN: ${PAGBANK_TOKEN:-}
      PAGBANK_EMAIL: ${PAGBANK_EMAIL:-}
      PAGBANK_WEBHOOK_SECRET: ${PAGBANK_WEBHOOK_SECRET:-}
      PAGBANK_WEBHOOK_BASE_URL: ${PAGBANK_WEBHOOK_BASE_URL:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - api_uploads:/shared/uploads
      - ./public:/legacy/public:ro
      - ./public_html:/legacy/public_html:ro
    networks:
      - cknet

volumes:
  pgdata:
  api_uploads:

networks:
  cknet:
    driver: bridge
