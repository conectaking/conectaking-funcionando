# Produção no VPS (Hetzner) — Postgres só na rede interna do Docker
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: conectaking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conectaking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-conectaking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conectaking} -d ${POSTGRES_DB:-conectaking}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - cknet

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conectaking-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      PORT: "5000"
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-conectaking}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-conectaking}
      DATABASE_SSL: "false"
    ports:
      - "80:5000"
    volumes:
      - api_uploads:/app/uploads
    networks:
      - cknet

volumes:
  pgdata:
  api_uploads:

networks:
  cknet:
    driver: bridge
