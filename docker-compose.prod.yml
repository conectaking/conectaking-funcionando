# Produção no VPS (Hetzner) — API só em localhost; Caddy faz 80/443
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: conectaking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conectaking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-conectaking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conectaking} -d ${POSTGRES_DB:-conectaking}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - cknet

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conectaking-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      laravel:
        condition: service_started
    env_file:
      - .env.prod
    environment:
      PORT: "5000"
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-conectaking}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-conectaking}
      DATABASE_SSL: "false"
      LARAVEL_CARD_ENABLED: "${LARAVEL_CARD_ENABLED:-true}"
      LARAVEL_HOST: laravel
      LARAVEL_PORT: "8080"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - api_uploads:/app/uploads
    networks:
      - cknet

  # Cartão virtual (migração gradual) — rotas /l/card/{slug} e /l/api/card/{slug}
  laravel:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    container_name: conectaking-laravel
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      APP_NAME: ConectaKing
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://www.conectaking.com.br
      APP_KEY: ${LARAVEL_APP_KEY}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-conectaking}
      DB_USERNAME: ${POSTGRES_USER:-conectaking}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - cknet

volumes:
  pgdata:
  api_uploads:

networks:
  cknet:
    driver: bridge
