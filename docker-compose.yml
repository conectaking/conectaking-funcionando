# Conecta King — local (só PHP): Postgres + Laravel/FrankenPHP
# Uso: docker compose --env-file .env.docker up --build
#
# App:   http://localhost:8080
# Health: http://localhost:8080/health

services:
  db:
    image: postgres:16-alpine
    container_name: conectaking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conectaking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conectaking}
      POSTGRES_DB: ${POSTGRES_DB:-conectaking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conectaking} -d ${POSTGRES_DB:-conectaking}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - cknet

  laravel:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    container_name: conectaking-laravel
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ConectaKing
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      APP_KEY: ${LARAVEL_APP_KEY:-base64:3H0rHGsdLIL0QfFRj6GitJ4WgjxMlzq9YsdYJocJ7Go=}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-conectaking}
      DB_USERNAME: ${POSTGRES_USER:-conectaking}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-conectaking}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      JWT_SECRET: ${JWT_SECRET:-conectaking-local-dev-secret-change-me}
      LEGACY_PUBLIC_PATH: /legacy/public
      LEGACY_PUBLIC_HTML_PATH: /legacy/public_html
      KS_UPLOADS_PATH: /shared/uploads
      SERVER_NAME: ":8080"
    ports:
      - "${LARAVEL_PORT:-8080}:8080"
    volumes:
      - api_uploads:/shared/uploads
      - ./public:/legacy/public:ro
      - ./public_html:/legacy/public_html:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - cknet

volumes:
  pgdata:
  api_uploads:

networks:
  cknet:
    driver: bridge
