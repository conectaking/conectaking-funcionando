# Conecta King — ambiente local (pré-visualizar no PC antes de subir)
# Uso: docker compose --env-file .env.docker up --build
#
# Painel: http://localhost:5000/dashboard.html?api=local
# Health: http://localhost:5000/health

services:
  db:
    image: postgres:16-alpine
    container_name: conectaking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conectaking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conectaking}
      POSTGRES_DB: ${POSTGRES_DB:-conectaking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conectaking} -d ${POSTGRES_DB:-conectaking}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conectaking-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      laravel:
        condition: service_started
    env_file:
      - .env.docker
    environment:
      PORT: "5000"
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-conectaking}:${POSTGRES_PASSWORD:-conectaking}@db:5432/${POSTGRES_DB:-conectaking}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-conectaking-local-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      LARAVEL_CARD_ENABLED: "${LARAVEL_CARD_ENABLED:-true}"
      LARAVEL_CARD_PUBLIC: "${LARAVEL_CARD_PUBLIC:-false}"
      LARAVEL_CARD_SLUGS: "${LARAVEL_CARD_SLUGS:-}"
      LARAVEL_CARD_APIS: "${LARAVEL_CARD_APIS:-true}"
      LARAVEL_PROFILE_API: "${LARAVEL_PROFILE_API:-false}"
      LARAVEL_HOST: laravel
      LARAVEL_PORT: "8080"
    ports:
      # Host:Container — container sempre escuta 5000
      - "${PORT:-5000}:5000"
    volumes:
      # Persist uploads locais entre restarts (opcional)
      - api_uploads:/app/uploads

  laravel:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    container_name: conectaking-laravel
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ConectaKing
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:5000
      APP_KEY: ${LARAVEL_APP_KEY:-base64:3H0rHGsdLIL0QfFRj6GitJ4WgjxMlzq9YsdYJocJ7Go=}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-conectaking}
      DB_USERNAME: ${POSTGRES_USER:-conectaking}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-conectaking}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      NODE_INTERNAL_URL: http://api:5000
      JWT_SECRET: ${JWT_SECRET:-conectaking-local-dev-secret-change-me}
    ports:
      - "${LARAVEL_PORT:-8080}:8080"

volumes:
  pgdata:
  api_uploads:
